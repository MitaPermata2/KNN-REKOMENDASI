<!doctype html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <title>FdHealth</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='img/favicon.png') }}">

    </head>
      <body>
               {% include 'includes/header.html' %}
          <div class="offcanvas offcanvas-start d-md-none" tabindex="-1" id="sidebarMenu">
              <div class="offcanvas-header bg-primary text-white">
              <h5 class="offcanvas-title px-3">Menu</h5>
              <button type="button" class="btn-close text-reset" data-bs-dismiss="offcanvas"></button>
              </div>
              <div class="offcanvas-body ">
              {% include 'includes/sidebar.html' %}
              </div>
          </div>
        
          <div class="container-fluid">
            <div class="row">
              <!-- Sidebar desktop -->
              <nav id="sidebarMenu" class="col-md-3 col-lg-2 d-none d-md-block bg-light sidebar">
                <div class="position-sticky">
                  {% include 'includes/sidebar.html' %}
                </div>
              </nav>
              
              <main class=" col-12 col-md-9 ms-sm-auto col-lg-10 px-md-4 px-3">
              {% block body %}
              {% endblock %}
              </main>
        
      
              {% block extra_style %}
              {% endblock %}
            </div>
          </div>
  
        <!-- Optional JavaScript; choose one of the two! -->
        <!-- Option 1: Bootstrap Bundle with Popper -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" ></script>
        <script src="/static/js/feather.min.js"></script>
    </body>
</html>
